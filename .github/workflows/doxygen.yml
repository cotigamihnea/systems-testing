name: Generate Doxygen Documentation

# Regula: rulează DOAR când se dă push la un tag care începe cu "v" (ex: v1.0)
on:
  push:
    tags:
      - 'v*'

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Install Doxygen
      run: |
        sudo apt-get update
        sudo apt-get install -y doxygen

    - name: Run Doxygen
      # Ne mutăm direct în folderul laboratorului unde se află Doxyfile
      working-directory: laboratories/cicd-documentation
      run: doxygen Doxyfile

    - name: Upload Doxygen Artifact
      uses: actions/upload-artifact@v3
      with:
        name: doxygen-html-docs
        # Salvăm folderul html generat de doxygen
        path: laboratories/cicd-documentation/html/